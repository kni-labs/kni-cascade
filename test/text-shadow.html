    <title>Shadow hover test — KNI Cascade</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
        gap: 32px;
        align-content: start;
        min-height: 100svh;
        margin: 0;
        padding: 32px;
        border: 0;
        background: #f5f5f5;
      }

      .shadow-card {
        width: 100%;
        min-height: 220px;
        padding: 32px;
        border: 1px solid #e5e5e5;
        border-radius: 16px;
        background: white;
        color: #222;
        text-align: center;
      }

      .shadow-card:focus-visible {
        outline: 3px solid #0061c7;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
