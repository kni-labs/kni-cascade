name: Validate and publish

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install release npm version
        run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Check package contents
        run: npm pack --dry-run --ignore-scripts

  publish:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Verify teammate approval
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const latest = new Map();
            for (const review of reviews) {
              if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) {
                latest.set(review.user.login, review);
              }
            }
            const approved = [...latest.values()].some(review =>
              review.state === 'APPROVED' &&
              review.user.type === 'User' &&
              ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(review.author_association) &&
              review.user.login !== pr.user.login &&
              review.commit_id === pr.head.sha
            );
            if (!approved) {
              core.setFailed('Publishing requires a teammate approval of the final PR commit.');
            }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.1
      - name: Check whether this version needs publishing
        id: release
        run: node scripts/release-status.cjs
      - if: steps.release.outputs.publish == 'true'
        run: npm ci
      - if: steps.release.outputs.publish == 'true'
        run: npm run check && npm run build
      - name: Publish to npm using trusted publishing
        if: steps.release.outputs.publish == 'true'
        run: npm publish --access public --ignore-scripts
