name: Validate and publish

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install release npm version
        run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Check package contents
        run: npm pack --dry-run --ignore-scripts

  publish:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.1
      - name: Check whether this version needs publishing
        id: release
        run: node scripts/release-status.cjs
      - if: steps.release.outputs.publish == 'true'
        run: npm ci
      - if: steps.release.outputs.publish == 'true'
        run: npm run check && npm run build
      - name: Publish to npm using trusted publishing
        if: steps.release.outputs.publish == 'true'
        run: npm publish --access public --ignore-scripts
